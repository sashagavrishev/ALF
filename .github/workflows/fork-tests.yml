# Fork-only CI, beside upstream's tests.yml rather than replacing it.
#
# Runs what this fork builds -- GNU, HDF5, serial and MPI -- on a stock runner
# with no container. ALF builds its own HDF5 either way, so dropping the
# container costs only the apt line below. The image is pinned rather than
# `latest`: the Devel legs compile with -Werror, so a runner bumping gfortran
# turns CI red with no commit behind it.
name: "Fork tests"

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  # paths-filter reads the changed files from the API on pull_request events;
  # on push it walks the git history and needs nothing.
  pull-requests: read

concurrency:
  group: fork-tests-${{ github.ref }}
  cancel-in-progress: true

env:
  # ALF generates its own module dependencies, so the build parallelises.
  # make reads this from the environment, which keeps it out of the shared
  # alf_test action.
  MAKEFLAGS: "-j4"
  # Four threads measured worse than one on this suite, whose problems are
  # small; one also keeps thread-count nondeterminism away from the bitwise
  # comparisons.
  OPENBLAS_NUM_THREADS: "1"

jobs:
  # Which of the jobs below is worth running. Gating the jobs rather than the
  # workflow keeps them reporting: a job skipped by `if:` still posts a status,
  # where a workflow filtered out by `on: paths:` posts nothing at all and would
  # leave a required check waiting on a run that never starts.
  changes:
    name: Detect what changed
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      fortran: ${{ steps.filter.outputs.fortran }}
    steps:
      - uses: actions/checkout@v6
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            fortran:
              - '**/*.F90'
              - '**/*.f90'
              - '**/*.f'
              - '**/Makefile'
              - 'configure.sh'
              - 'Prog/**'
              - 'Libraries/**'
              - 'testsuite/**'
              - '.github/workflows/fork-tests.yml'
              - '.github/actions/alf_test/**'

  lint_stopcommands:
    name: Lint Fortran STOP statements
    needs: changes
    if: needs.changes.outputs.fortran == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - name: Check for forbidden STOP/ERROR STOP
        run: |
          set -euo pipefail
          ! grep -irn -e "^\s*error\s*stop" -e "^\s*stop" --include="*.F90" \
            --exclude-dir=Analysis --exclude-dir=HDF5 --exclude-dir=testsuite \
            --exclude-dir=Not_supported --exclude="runtime_error_mod.F90" || {
            echo "STOP/ERROR STOP found."; exit 1;
          }

  build_and_test:
    name: GNU · ${{ matrix.mode }} · ${{ matrix.devel || 'plain' }} · HDF5
    needs: changes
    if: needs.changes.outputs.fortran == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # MPI is the only configuration that compiles control_mod's MPI_REDUCE
        # of the timers and acceptances. Devel adds -pedantic -Werror and
        # -O0 -fcheck=all.
        mode: [noMPI, MPI]
        devel: ["", "Devel"]
    steps:
      - uses: actions/checkout@v6

      # gfortran and cmake are preinstalled; a BLAS is not. OpenBLAS measures the
      # same as the netlib reference on this suite -- two netlib readings of the
      # identical job differed by more than the two libraries did -- so the
      # choice is consistency with production builds, not speed here.
      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libopenblas-dev

      # Installs one MPI and puts its wrapper and launcher on PATH together.
      # apt-installing a second MPI beside the image's own leaves mpifort and
      # mpiexec free to resolve to different ones, and the mismatch is silent:
      # every rank initialises as a singleton rank 0.
      - name: Set up MPI
        if: matrix.mode == 'MPI'
        uses: mpi4py/setup-mpi@v1
        with:
          mpi: openmpi

      - name: Record compiler version
        id: fc
        run: echo "version=$(gfortran -dumpfullversion)" >> "$GITHUB_OUTPUT"

      # Keyed on the full compiler version: the Fortran module HDF5 installs is
      # only readable by the compiler that built it, and the module format can
      # change within a major release. The MPI legs build it with mpifort,
      # hence the mode in the key.
      - name: Cache the HDF5 build
        uses: actions/cache@v5
        with:
          key: linux-HDF5-gfortran-${{ steps.fc.outputs.version }}-${{ matrix.mode }}
          path: HDF5/*/

      - uses: ./.github/actions/alf_test
        with:
          args: GNU ${{ matrix.mode }} ${{ matrix.devel }} HDF5
